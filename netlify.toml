[build]
  command = "npm run build"
  publish = "dist"

# Hashed build assets never change under the same name: cache them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Globe textures are large and rarely change: cache for a week.
[[headers]]
  for = "/globe/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
